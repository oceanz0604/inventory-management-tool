<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b14">
  <title>झटपट — Admin Console</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .admin-body { min-height:100vh; background:var(--bg); color:var(--text); }
    .admin-topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem 1.5rem; background:var(--bg-card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; padding-top:calc(1rem + env(safe-area-inset-top)); }
    .admin-brand { display:flex; align-items:center; gap:.6rem; font-weight:700; }
    .admin-brand .logo { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg,#7c6cff,#5b4af0); color:#fff; }
    .admin-brand .tag { font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:var(--text-light); }
    .admin-wrap { max-width:1100px; margin:0 auto; padding:1.5rem; }
    .admin-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .admin-stat { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:1.1rem 1.25rem; }
    .admin-stat .n { font-size:1.9rem; font-weight:700; }
    .admin-stat .l { color:var(--text-light); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
    .admin-stat .i { float:right; font-size:1.1rem; color:var(--primary); opacity:.8; }
    .admin-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .admin-card-head { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid var(--border); gap:.5rem; flex-wrap:wrap; }
    .admin-card-head h2 { font-size:1.05rem; }
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th, .admin-table td { text-align:left; padding:.8rem 1.25rem; border-bottom:1px solid var(--border); font-size:.88rem; white-space:nowrap; }
    .admin-table th { color:var(--text-light); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
    .admin-table tr:last-child td { border-bottom:none; }
    .code-chip { font-family:monospace; background:var(--primary-soft); color:var(--primary); padding:.15rem .5rem; border-radius:7px; font-size:.82rem; }
    .admin-login-screen { min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:linear-gradient(135deg,#0a0b14,#171a2e); }
    .admin-login-card { width:100%; max-width:380px; background:rgba(255,255,255,.06); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:2rem; }
    .admin-login-card .auth-logo { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:1.4rem; background:linear-gradient(135deg,#7c6cff,#5b4af0); color:#fff; margin:0 auto 1rem; }
    .admin-login-card h1 { text-align:center; color:#fff; font-size:1.3rem; margin-bottom:.25rem; }
    .admin-login-card p.sub { text-align:center; color:rgba(255,255,255,.6); font-size:.85rem; margin-bottom:1.5rem; }
    .empty-row td { text-align:center; color:var(--text-light); padding:2rem; white-space:normal; }

    /* Mobile: turn each wide table row into a stacked card (no horizontal scroll). */
    @media (max-width:640px) {
      .admin-wrap { padding:1rem; }
      .admin-table thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      .admin-table, .admin-table tbody, .admin-table tr, .admin-table td { display:block; width:100%; }
      .admin-table tr { border:1px solid var(--border); border-radius:14px; margin:.7rem 1rem; padding:.35rem 0; background:var(--bg); }
      .admin-table td { display:flex; align-items:center; justify-content:space-between; gap:1rem; border:none; padding:.55rem 1rem; white-space:normal; text-align:right; }
      .admin-table td::before { content:attr(data-label); color:var(--text-light); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; font-weight:600; flex:0 0 auto; }
      .admin-table td strong { text-align:right; }
      .admin-table tr.empty-row { display:block; }
      .admin-table tr.empty-row td { justify-content:center; }
      .admin-table tr.empty-row td::before { content:none; }
    }
  </style>
</head>
<body class="admin-body">

  <!-- ===== Admin login ===== -->
  <div id="admin-login" class="admin-login-screen">
    <form id="admin-login-form" class="admin-login-card auth-form">
      <div class="auth-logo"><i class="fas fa-bolt"></i></div>
      <h1>Admin Console</h1>
      <p class="sub">झटपट — restricted access</p>
      <div class="form-group">
        <label for="admin-email">Email</label>
        <div class="input-icon"><i class="fas fa-envelope"></i>
          <input type="email" id="admin-email" placeholder="admin@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <div class="input-icon"><i class="fas fa-lock"></i>
          <input type="password" id="admin-password" placeholder="Password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      <button type="button" id="admin-back-link" class="auth-link-btn" onclick="location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to app</button>
      <div id="admin-error" class="auth-error hidden"></div>
    </form>
  </div>

  <!-- ===== Admin dashboard ===== -->
  <div id="admin-app" class="hidden">
    <div class="admin-topbar">
      <div class="admin-brand">
        <span class="logo"><i class="fas fa-bolt"></i></span>
        <div><div>झटपट</div><div class="tag">Admin Console</div></div>
      </div>
      <div style="display:flex; align-items:center; gap:.75rem;">
        <span id="admin-who" style="color:var(--text-light); font-size:.85rem;"></span>
        <button id="admin-logout" class="btn btn-secondary btn-sm"><i class="fas fa-right-from-bracket"></i> Sign out</button>
      </div>
    </div>

    <div class="admin-wrap">
      <div class="admin-stats" id="admin-stats"></div>

      <div class="admin-card">
        <div class="admin-card-head">
          <h2>Customers (Companies)</h2>
          <div style="display:flex; gap:.5rem;">
            <button id="admin-add" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Add customer</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead><tr><th>Company</th><th>Code</th><th>Owner login</th><th>Team</th><th>Products</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody id="admin-companies"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Add customer modal ===== -->
  <div id="add-customer-modal" class="modal hidden">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content" style="max-width:460px;">
      <div class="modal-header">
        <h2>Add new customer</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <form id="add-customer-form" class="modal-body">
        <div class="form-group">
          <label for="cust-company">Company name</label>
          <input type="text" id="cust-company" placeholder="Roma Store" required>
        </div>
        <div class="form-group">
          <label for="cust-code">Company code <span style="color:var(--text-muted);font-weight:400;">(workers log in with this)</span></label>
          <input type="text" id="cust-code" placeholder="romastore" autocapitalize="none" spellcheck="false" required>
          <small class="form-hint">Lowercase letters/numbers only. Must be unique.</small>
        </div>
        <div class="form-group">
          <label for="cust-owner">Owner name</label>
          <input type="text" id="cust-owner" placeholder="Roma" required>
        </div>
        <div class="form-group">
          <label for="cust-username">Owner username</label>
          <input type="text" id="cust-username" placeholder="roma" autocapitalize="none" spellcheck="false" required>
          <small class="form-hint">Owner signs in with the company code + this username.</small>
        </div>
        <div class="form-group">
          <label for="cust-password">Owner password</label>
          <input type="password" id="cust-password" placeholder="At least 4 characters" required minlength="4">
        </div>
        <div id="add-customer-error" class="auth-error hidden" style="color:var(--danger);"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Create customer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Set / reset owner login modal ===== -->
  <div id="set-login-modal" class="modal hidden">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content" style="max-width:420px;">
      <div class="modal-header">
        <h2>Set owner login</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <form id="set-login-form" class="modal-body">
        <p class="form-hint" id="set-login-company"></p>
        <input type="hidden" id="set-login-cid">
        <div class="form-group">
          <label for="set-login-username">Owner username</label>
          <input type="text" id="set-login-username" placeholder="roma" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="set-login-password">New password</label>
          <input type="password" id="set-login-password" placeholder="At least 4 characters" required minlength="4">
        </div>
        <div id="set-login-error" class="auth-error hidden" style="color:var(--danger);"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save login</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/creds.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
